[pytest]
verbosity_assertions = 2
verbosity_test_cases = 2
cache_dir = /tmp/pytest_cache
# pytest-notebook (transitive dep in the image) registers an nb_regression
# plugin whose pytest_collect_file(path, parent) hook was removed in pytest 8.
# Our tests use nbclient directly and don't need it, so block the plugin to
# stop pytest from failing at collection time.
#
# dash (a hard dependency of open3d) registers a pytest plugin of its own that
# uses an old-style hookimpl and warns on every run. Nothing here drives dash,
# so block it as well.
#
# -s keeps pytest from capturing stdout, so the notebook output that
# test_notebook.py echoes reaches the CI log on passing runs, not just failures.
addopts = -s -p no:nb_regression -p no:dash
